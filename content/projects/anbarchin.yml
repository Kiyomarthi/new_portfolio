title: انبارچین — پلتفرم اجاره انبار و پارکینگ
company: ویاناسیستم
date: 2025-09-23
description: |
  توسعه و پیاده‌سازی پلتفرم اجاره انباری و پارکینگ که کاربران می‌توانند فضای موردنظر خود را برای اجاره ثبت کنند و مشتریان نیز بر اساس موقعیت مکانی، فضای مناسب را پیدا و اجاره کنند؛ با تمرکز بر ارتباطات لحظه‌ای، نقشه‌های تعاملی، داده‌های وکتوری، لایه‌ها و کلاسترهای نقشه و رابط کاربری مبتنی بر Vuetify.

