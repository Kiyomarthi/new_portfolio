title: Bloom Finance App Redesign
challenges:
  content: |
    ## The Challenge

    Bloom Finance needed to transform a cluttered, legacy interface into a clean, modern dashboard that could display complex financial data in an intuitive way. The main challenges were:

    - **Information Density**: Users needed to see a lot of data at a glance without feeling overwhelmed
    - **Data Visualization**: Financial charts and graphs needed to be both beautiful and accurate
    - **Mobile Experience**: The app needed to work seamlessly across all device sizes

    ### The Approach

    I started with extensive user research, conducting interviews with 25+ users to understand their pain points. Then I created a modular design system that could scale across the entire application.

    ### The Result

    The redesigned interface led to a **32% increase in user retention** and a **45% reduction in support tickets** related to navigation confusion.
