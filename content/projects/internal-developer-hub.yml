challenges:
  content: |
    ## The Challenge

    The Nuxt team needed a centralized hub that could serve as the single source of truth for all internal documentation, tooling, and resources. The existing scattered approach was causing inefficiency and knowledge loss.

    ### Key Requirements

    - **Unified Search**: One search bar to find anything across all documentation
    - **Access Control**: Different permission levels for different team members
    - **Integration**: Seamless connection with GitHub, Figma, and other tools
    - **Performance**: Instant loading even with thousands of documents

    ### Solution

    Built a modular system using Nuxt Content as the backbone, with a custom search implementation using Fuse.js. The design system was built on top of Nuxt UI for consistency.

    ### Impact

    Reduced time spent searching for information by an estimated **60%** and significantly improved onboarding time for new team members.

