challenges:
  content: |
    ## The Challenge

    EcoTrack needed to make environmental data feel actionable rather than depressing. Users wanted to make a difference but felt overwhelmed by the scale of climate change.

    ### Research Phase

    Conducted surveys with 200+ participants and in-depth interviews with 30 environmentally-conscious users. Key findings:

    - Users wanted **personalized recommendations**, not generic advice
    - Gamification elements increased engagement significantly
    - Social features helped maintain long-term motivation

    ### Design Solution

    Created a progress-focused interface with daily challenges, achievement badges, and community leaderboards. The key was making small actions feel meaningful through clear visual feedback.

